services:
  redpanda:
    image: redpandadata/redpanda:v25.3.18
    container_name: atlas-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: ghcr.io/seaweedfs/minio-compat:latest
    container_name: atlas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - seaweedfs-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: atlas-api
    restart: unless-stopped
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-development}
      ATLAS_API_KEY: ${ATLAS_API_KEY:-}
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: atlas
      REDPANDA_ADMIN_URL: http://redpanda:9644
      S3_HEALTH_URL: http://minio:9000/minio/health/live
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: atlas-dashboard
    restart: unless-stopped
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-development}
      ATLAS_API_KEY: ${ATLAS_API_KEY:-}
      ATLAS_API_URL: http://api:8000
    ports:
      - "127.0.0.1:18501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  redpanda-data:
  seaweedfs-data:
  postgres-data:
